<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="Steer a yellow dot with microphone-derived bits in a winding maze or a wraparound arena.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
  <title>PSI Maze</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-dot" aria-hidden="true"></span> PSI Maze</div>
      <nav aria-label="Main navigation">
        <button id="nav-maze" aria-current="page">Maze</button>
        <button id="nav-apple">Apple Catch</button>
        <button id="nav-history">History</button>
        <button id="nav-players" aria-label="Switch player">Player 1</button>
      </nav>
      <button id="install" hidden>Install</button>
    </header>
    <main>
      <section id="game" aria-labelledby="game-title">
        <div class="game-heading">
          <h1 id="game-title">Maze</h1>
          <p id="progress-label">Loading training history…</p>
          <p id="apple-count" hidden></p>
        </div>
        <div class="board">
          <canvas id="arena" width="748" height="428" role="img" aria-label="A yellow dot follows a winding blue corridor to a marked finish line."></canvas>
        </div>
        <div class="game-controls">
          <p id="status" role="status">Press Start to enable the microphone.</p>
          <button id="start" class="primary" disabled>Start</button>
        </div>
      </section>
      <section id="history" aria-labelledby="history-title" hidden>
        <div class="history-heading">
          <h1 id="history-title">Training history</h1>
          <button id="export" class="secondary" hidden>Export CSV</button>
        </div>
        <div id="history-modes" aria-label="History mode">
          <button id="history-maze" class="secondary" aria-pressed="true">Maze</button>
          <button id="history-apple" class="secondary" aria-pressed="false">Apple Catch</button>
          <button id="history-legacy" class="secondary" aria-pressed="false" hidden>Earlier maze</button>
        </div>
        <p id="history-progress" role="status"></p>
        <div id="results"></div>
      </section>
      <section id="players" aria-labelledby="players-title" hidden>
        <div class="history-heading">
          <h1 id="players-title">Players</h1>
        </div>
        <div id="player-list"></div>
        <div class="player-actions">
          <button id="add-player" class="primary">Add player</button>
          <button id="rename-player" class="secondary">Rename current player</button>
        </div>
        <form id="player-form" hidden>
          <label for="player-name">Player name</label>
          <div class="player-actions">
            <input id="player-name" name="player-name" maxlength="32" required autocomplete="off">
            <button class="primary">Save</button>
            <button id="cancel-player-form" type="button" class="secondary">Cancel</button>
          </div>
        </form>
        <p id="player-status" role="status"></p>
      </section>
    </main>
  </div>
</body>
</html>
